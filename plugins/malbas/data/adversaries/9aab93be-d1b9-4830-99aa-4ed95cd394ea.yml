name: APT-StealthFalcon-v1
description: >-
  Stealth Falcon (G0038, aka FruityArmor), widely attributed to the UAE; espionage against government, defense and dissidents. Check Point (June 2025) reported zero-day CVE-2025-33053 used against government and defense organizations including in Qatar. Lab-safe emulation. LOLBin/rundll32 abuse, process injection, LSASS access, keylogging and web C2 are simulated with benign markers; the obfuscate/decode step runs for real and self-cleans. See docs/APT-StealthFalcon-v1.md.
