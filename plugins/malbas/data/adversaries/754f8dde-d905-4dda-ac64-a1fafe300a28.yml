description: >-
  APT35 / APT42 (G0059 / G1044, aka Charming Kitten / Mint Sandstorm / Phosphorus / TA453), an Iran (IRGC) espionage group focused on identity and mailbox phishing against government, diplomats, media and academia. Qatar named in analysis of leaked internal APT35 documents (Oct 2025, moderate confidence). Lab-safe emulation. Mailbox collection and web C2 are simulated with benign markers; the browser credential-store check reads no secrets; Run-key persistence self-cleans. See docs/APT-APT35-v1.md.
