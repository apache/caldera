name: APT-OilRig-v1
description: >-
  OilRig (G0049, aka APT34 / Helix Kitten / Hazel Sandstorm / Earth Simnavaz),
  an Iran (MOIS) espionage group active against government, energy, finance and
  telecom targets across the Gulf. Lab-safe single-host subset that mirrors the
  CTID OilRig emulation plan sequence. Multi-host steps (RDP, Plink tunnel,
  PsExec to remote hosts, EWS exfiltration) and real malware (Mimikatz) are
  left out or simulated - see docs/APT-OilRig-v1.md. For the full plan, import
  it through Caldera's Emu plugin.
