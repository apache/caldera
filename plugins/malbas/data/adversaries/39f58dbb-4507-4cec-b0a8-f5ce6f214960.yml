description: >-
  UNC1860 (parallels Scarred Manticore / Shrouded Snooper / Storm-0861), an Iran (likely MOIS) initial-access broker using passive backdoors, web shells and repurposed drivers against Middle East government and telecom. Mandiant reported it vetting accounts on Qatari domains (reconnaissance). Lab-safe emulation. Web shell, proxy/tunneling and web C2 are simulated with benign markers; the service-creation step runs for real and self-cleans. See docs/APT-UNC1860-v1.md.
