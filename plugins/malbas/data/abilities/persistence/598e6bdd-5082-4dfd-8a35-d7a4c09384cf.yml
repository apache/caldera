- id: 598e6bdd-5082-4dfd-8a35-d7a4c09384cf
  name: Scheduled task persistence
  description: Register a benign scheduled task, then delete it on cleanup.
  tactic: persistence
  technique:
    attack_id: T1053.005
    name: "Scheduled Task/Job: Scheduled Task"
  platforms:
    windows:
      psh:
        command: |
          schtasks /create /tn CalderaMuddyWater /tr "cmd.exe /c echo emulation" /sc onlogon /f
        cleanup: |
          schtasks /delete /tn CalderaMuddyWater /f
