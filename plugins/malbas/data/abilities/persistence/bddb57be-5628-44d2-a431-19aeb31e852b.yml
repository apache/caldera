- id: bddb57be-5628-44d2-a431-19aeb31e852b
  name: "Registry Run key persistence"
  description: "Add a benign Run key (APT33 'Tickler' behaviour), then remove it on cleanup."
  tactic: persistence
  technique:
    attack_id: T1547.001
    name: "Boot or Logon Autostart Execution: Registry Run Keys / Startup Folder"
  platforms:
    windows:
      psh:
        command: |
          reg add "HKCU\Software\Microsoft\Windows\CurrentVersion\Run" /v CalderaEmu /t REG_SZ /d calc.exe /f
        cleanup: |
          reg delete "HKCU\Software\Microsoft\Windows\CurrentVersion\Run" /v CalderaEmu /f
