- id: 74aec65b-cff7-4cc1-b4ea-ef02989d4a42
  name: "Registry Run key persistence"
  description: "Add a benign Run key, then remove it on cleanup."
  tactic: persistence
  technique:
    attack_id: T1547.001
    name: "Boot or Logon Autostart Execution: Registry Run Keys / Startup Folder"
  platforms:
    windows:
      psh:
        command: |
          reg add "HKCU\Software\Microsoft\Windows\CurrentVersion\Run" /v CalderaEmuA35 /t REG_SZ /d calc.exe /f
        cleanup: |
          reg delete "HKCU\Software\Microsoft\Windows\CurrentVersion\Run" /v CalderaEmuA35 /f
