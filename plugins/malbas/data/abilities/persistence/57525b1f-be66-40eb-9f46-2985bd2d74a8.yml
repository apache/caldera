- id: 57525b1f-be66-40eb-9f46-2985bd2d74a8
  name: Registry Run key persistence
  description: Create a benign Run key for persistence, then remove it on cleanup.
  tactic: persistence
  technique:
    attack_id: T1547.001
    name: "Boot or Logon Autostart Execution: Registry Run Keys / Startup Folder"
  platforms:
    windows:
      psh:
        command: |
          reg add "HKCU\Software\Microsoft\Windows\CurrentVersion\Run" /v CalderaMuddyWater /t REG_SZ /d "calc.exe" /f
        cleanup: |
          reg delete "HKCU\Software\Microsoft\Windows\CurrentVersion\Run" /v CalderaMuddyWater /f
