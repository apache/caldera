  technique:
    attack_id: T1003.001
    name: "OS Credential Dumping: LSASS Memory"
  platforms:
    windows:
      psh:
        command: |
          Set-Content "$env:TEMP\a39_lsass_marker.txt" 'SIMULATED LSASS dump - no memory accessed'
        cleanup: |
          Remove-Item "$env:TEMP\a39_lsass_marker.txt" -Force
