- id: 1dce9bbe-ada5-473f-86e2-2eec3fe5f987
  name: "LSASS dump (SIMULATED)"
  description: "SIMULATED only. Writes a marker representing a Mimikatz-style credential dump. No process memory is accessed. Self-cleans."
